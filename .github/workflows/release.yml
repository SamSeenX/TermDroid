name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            artifact_name: termdroid-darwin-arm64
            archive_name: termdroid-v${{ github.ref_name }}-darwin-arm64.tar.gz
          - goos: darwin
            goarch: amd64
            artifact_name: termdroid-darwin-amd64
            archive_name: termdroid-v${{ github.ref_name }}-darwin-amd64.tar.gz
          - goos: linux
            goarch: amd64
            artifact_name: termdroid-linux-amd64
            archive_name: termdroid-v${{ github.ref_name }}-linux-amd64.tar.gz
          - goos: linux
            goarch: arm64
            artifact_name: termdroid-linux-arm64
            archive_name: termdroid-v${{ github.ref_name }}-linux-arm64.tar.gz
          - goos: windows
            goarch: amd64
            artifact_name: termdroid.exe
            archive_name: termdroid-v${{ github.ref_name }}-windows-amd64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          go build -trimpath -ldflags="-s -w" -o build/${{ matrix.artifact_name }} .

      - name: Package Archive (Unix)
        if: matrix.goos != 'windows'
        run: |
          cd build
          tar -czf ../${{ matrix.archive_name }} ${{ matrix.artifact_name }}
          cd ..

      - name: Package Archive (Windows)
        if: matrix.goos == 'windows'
        run: |
          cd build
          zip ../${{ matrix.archive_name }} ${{ matrix.artifact_name }}
          cd ..

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
